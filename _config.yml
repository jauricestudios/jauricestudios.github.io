title: Jaurice Research Notes
author: Jaurice O'Connor
copyright: "2026"
logo: logo.png

execute:
  execute_notebooks: off

repository:
  url: https://github.com/jauricestudios/jaurice-market-notes
  branch: main

html:
  use_issues_button: false
  use_repository_button: true
  use_edit_page_button: false
  use_download_button: false
  home_page_in_navbar: false
  extra_navbar: ""
  extra_footer: ""

theme:
  name: sphinx_book_theme
  options:
    default_mode: dark

sphinx:
  config:
    html_static_path:
      - "_static"
    html_css_files:
      - "dark_theme_v5.css"
      - "oxblood_override.css"
    html_js_files:
      - "portfolio_nav.js"
    html_title: "Jaurice O'Connor | Risk Analytics Portfolio"

exclude_patterns:
  - "_build"
  - ".venv"
  - ".venv_energy"
  - "archive_unused"
  - "energy_pricing_model copy"
  - "Untitled.ipynb"
  - "**/.ipynb_checkpoints"
  - "**/.DS_Store"
